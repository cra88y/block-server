[sources.docker_logs]
type = "docker_logs"
include_containers = ["nakama"]
auto_partial_merge = true

[transforms.filter_telemetry]
type = "filter"
inputs = ["docker_logs"]
condition = 'contains(string!(.message), "telemetry_event")'

[transforms.parse_json]
type = "remap"
inputs = ["filter_telemetry"]
source = '''
  parsed = parse_json!(.message)
  
  .event_type = parsed.event_type
  .timestamp = parsed.timestamp
  .user_id = parsed.user_id
  .clock_skewed = parsed.clock_skewed ?? false
  
  # payload can be a native JSON object (via json.RawMessage) or a stringified JSON string
  if is_string(parsed.payload) {
    .payload = parse_json(string!(parsed.payload)) ?? {}
  } else if is_object(parsed.payload) {
    .payload = parsed.payload
  } else {
    .payload = {}
  }
  
  # Docker runtime fields are high-cardinality noise with zero analytical value; strip them to keep R2 objects lean
  del(.container_created_at)
  del(.container_id)
  del(.container_name)
  del(.image)
  del(.label)
  del(.source_type)
  del(.stream)
  del(.message)
'''

[sinks.r2_lakehouse]
type = "aws_s3"
inputs = ["parse_json"]
bucket = "block"
endpoint = "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
region = "auto"
auth.access_key_id = "${R2_ACCESS_KEY}"
auth.secret_access_key = "${R2_SECRET_KEY}"
compression = "gzip"
key_prefix = "year=%Y/month=%m/day=%d/"

[sinks.r2_lakehouse.encoding]
codec = "json"

[sinks.r2_lakehouse.batch]
max_bytes = 5000000
timeout_secs = 300

[sinks.r2_lakehouse.buffer]
type = "disk"
max_size = 536870912 # 512MB

[transforms.filter_discord_alerts]
type = "filter"
inputs = ["parse_json"]
condition = 'includes(["crash", "non_fatal_error", "iap_purchase", "match_abandoned", "user_feedback"], .event_type)'

[transforms.throttle_discord]
type = "throttle"
inputs = ["filter_discord_alerts"]
threshold = 10
window_secs = 60

[transforms.format_discord]
type = "remap"
inputs = ["throttle_discord"]
source = '''
  event = to_string!(.event_type)
  title_str = event
  color_int = 4999756 # surface0 (#4c4f69)
  
  # Catppuccin Mocha Palette
  if event == "crash" {
    title_str = "ftl :: " + event
    color_int = 16026746 # red (#f38ba8)
  } else if event == "non_fatal_error" {
    title_str = "err :: " + event
    color_int = 16763261 # peach (#fab387)
  } else if event == "iap_purchase" {
    title_str = "usd :: " + event
    color_int = 10933100 # green (#a6e3a1)
  } else if event == "match_abandoned" {
    title_str = "wrn :: " + event
    color_int = 16377227 # yellow (#f9e2af)
  } else if event == "user_feedback" {
    title_str = "msg :: " + event
    color_int = 13813982 # pink (#f5c2e7)
  }
  
  uid = string(.user_id) ?? "unknown"
  app_ver = string(.payload.app_version) ?? string(.payload.AppVersion) ?? "?"
  plat = string(.payload.platform) ?? string(.payload.Platform) ?? "?"
  state = string(.payload.context_game_state) ?? string(.payload.ContextGameState) ?? "?"
  overlay = string(.payload.current_overlay) ?? string(.payload.CurrentOverlay) ?? "none"
  
  msg = string(.payload.message) ?? string(.payload.Message) ??
        string(.payload.reason) ?? string(.payload.Reason) ??
        string(.payload.exception_type) ?? string(.payload.ExceptionType) ??
        string(.payload.feedback_text) ?? string(.payload.FeedbackText) ?? "none"

  if event == "iap_purchase" {
    prod = string(.payload.product_id) ?? string(.payload.ProductId) ?? "?"
    amt = to_string(.payload.amount) ?? to_string(.payload.Amount) ?? "?"
    curr = string(.payload.currency) ?? string(.payload.Currency) ?? ""
    msg = prod + " -> " + amt + " " + curr
  }
  
  if length(msg) > 800 {
    msg = slice!(msg, 0, 800) + " ...[trunc]"
  }
  
  breadcrumbs = array(.payload.breadcrumbs) ?? array(.payload.Breadcrumbs) ?? []
  trc = "none"
  if length(breadcrumbs) > 0 {
    trc = join!(breadcrumbs, " > ")
  }

  stack = string(.payload.stack_trace) ?? string(.payload.StackTrace) ?? string(.payload.diagnostic_trace) ?? string(.payload.DiagnosticTrace) ?? ""
  if length(stack) > 800 {
    stack = slice!(stack, 0, 800) + " ...[trunc]"
  }
  
  # Build a dense, uniform code block
  body = "msg :: " + msg + "\n"
  body = body + "usr :: " + uid + "\n"
  body = body + "env :: " + plat + " [" + app_ver + "]\n"
  body = body + "ctx :: " + state + " [" + overlay + "]\n"
  body = body + "trc :: " + trc
  
  if stack != "" {
    body = body + "\nstk ::\n" + stack
  }
  
  if length(body) > 3900 {
    body = slice!(body, 0, 3900) + "\n...[trunc]"
  }
  
  embed = {
    "title": "` " + title_str + " `",
    "description": "```log\n" + body + "\n```",
    "color": color_int
  }
  
  payload_obj = {
    "embeds": [embed]
  }
  
  . = encode_json(payload_obj)
'''

[sinks.discord_webhook]
type = "http"
inputs = ["format_discord"]
uri = "${DISCORD_WEBHOOK_URL}"
method = "post"
healthcheck.enabled = false

[sinks.discord_webhook.encoding]
codec = "text"

[sinks.discord_webhook.request.headers]
Content-Type = "application/json"

[sinks.discord_webhook.batch]
max_events = 1
