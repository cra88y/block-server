[sources.docker_logs]
type = "docker_logs"
include_containers = ["nakama"]
auto_partial_merge = true

[transforms.filter_telemetry]
type = "filter"
inputs = ["docker_logs"]
condition = 'contains(string!(.message), "telemetry_event")'

[transforms.parse_json]
type = "remap"
inputs = ["filter_telemetry"]
source = '''
  parsed = parse_json!(.message)
  
  .event_type = parsed.event_type
  .timestamp = parsed.timestamp
  .user_id = parsed.user_id
  
  # payload is stored as a stringified JSON string by Nakama's logger; must be parsed again to be queryable in Parquet
  .payload = parse_json!(parsed.payload)
  
  # Docker runtime fields are high-cardinality noise with zero analytical value; strip them to keep R2 objects lean
  del(.container_created_at)
  del(.container_id)
  del(.container_name)
  del(.image)
  del(.label)
  del(.source_type)
  del(.stream)
  del(.message)
'''

[sinks.r2_lakehouse]
type = "aws_s3"
inputs = ["parse_json"]
bucket = "block"
endpoint = "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
region = "auto"
auth.access_key_id = "${R2_ACCESS_KEY}"
auth.secret_access_key = "${R2_SECRET_KEY}"
compression = "gzip"
key_prefix = "year=%Y/month=%m/day=%d/"

[sinks.r2_lakehouse.encoding]
codec = "json"

[sinks.r2_lakehouse.batch]
max_bytes = 5000000
timeout_secs = 300

[transforms.filter_discord_alerts]
type = "filter"
inputs = ["parse_json"]
condition = 'includes(["crash", "non_fatal_error", "iap_purchase", "match_abandoned"], .event_type)'

[transforms.format_discord]
type = "remap"
inputs = ["filter_discord_alerts"]
source = '''
  title_str = "🔔 " + to_string!(.event_type)
  color_int = 3447003 # blue
  
  if .event_type == "crash" {
    title_str = "💥 CRASH"
    color_int = 16711680 # red
  } else if .event_type == "non_fatal_error" {
    title_str = "🚨 Non-Fatal Error"
    color_int = 16753920 # orange
  } else if .event_type == "iap_purchase" {
    title_str = "💰 IAP Purchase"
    color_int = 5763719 # green
  } else if .event_type == "match_abandoned" {
    title_str = "🏃 Match Abandoned"
    color_int = 16776960 # yellow
  }
  
  # Main message body
  msg = string(.payload.Message) ?? string(.payload.Reason) ?? string(.payload.ExceptionType) ?? "Event triggered without message."
  if .event_type == "iap_purchase" {
    msg = "Purchased `" + to_string!(.payload.product_id) + "` for **" + to_string!(.payload.amount) + " " + to_string!(.payload.currency) + "**"
  }
  
  if length(msg) > 1500 {
    msg = slice!(msg, 0, 1500) + "...\n[TRUNCATED]"
  }
  
  embed = {
    "title": title_str,
    "description": msg,
    "color": color_int,
    "fields": [
      {
        "name": "User ID",
        "value": "`" + to_string!(.user_id) + "`",
        "inline": false
      }
    ]
  }
  
  app_ver = string(.payload.AppVersion) ?? ""
  plat = string(.payload.Platform) ?? ""
  if app_ver != "" || plat != "" {
    embed.fields = push(embed.fields, {
      "name": "Environment",
      "value": plat + " v" + app_ver,
      "inline": true
    })
  }

  state = string(.payload.ContextGameState) ?? ""
  overlay = string(.payload.CurrentOverlay) ?? "None"
  if state != "" {
    embed.fields = push(embed.fields, {
      "name": "Game State",
      "value": state + " (Modal: " + overlay + ")",
      "inline": true
    })
  }

  breadcrumbs = array(.payload.Breadcrumbs) ?? []
  if length(breadcrumbs) > 0 {
    embed.fields = push(embed.fields, {
      "name": "Breadcrumb Trail",
      "value": "`" + join!(breadcrumbs, " → ") + "`",
      "inline": false
    })
  }

  # Build the final Discord webhook schema
  payload_obj = {
    "embeds": [embed]
  }

  # Replace the entire event with the JSON string to bypass array-batching
  . = encode_json(payload_obj)
'''

[sinks.discord_webhook]
type = "http"
inputs = ["format_discord"]
uri = "${DISCORD_WEBHOOK_URL}"
method = "post"
healthcheck.enabled = false

[sinks.discord_webhook.encoding]
codec = "text"

[sinks.discord_webhook.request.headers]
Content-Type = "application/json"

[sinks.discord_webhook.batch]
max_events = 1
